apiVersion: apps/v1
kind: Deployment

metadata:
  name: backend
  namespace: devops-demo

spec:

  replicas: 2

  selector:
    matchLabels:
      app: backend

  template:

    metadata:
      labels:
        app: backend

    spec:

      containers:

        - name: backend

          image: pathakc28/kubernetes:03

          imagePullPolicy: IfNotPresent

          ports:

            - containerPort: 8000

          env:

            - name: DATABASE_URL
              value: postgresql://appuser:apppassword@postgres:5432/appdb

          readinessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:

            httpGet:
              path: /health
              port: 8000

            initialDelaySeconds: 15
            periodSeconds: 20
